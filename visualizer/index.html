  <div id="app" class="app is-loading">
    <header class="topbar">
      <div class="brand" title="ChainLens · 探索链路可视化">
        <span class="brand-mark" aria-hidden="true"><svg class="icon"><use href="#i-lens"></use></svg></span>
        <span class="brand-text"><strong>ChainLens</strong><small>探索链路可视化</small></span>
      </div>

      <div class="scenario-picker">
        <svg class="icon" aria-hidden="true"><use href="#i-database"></use></svg>
        <label class="sr-only" for="scenario-select">选择场景</label>
        <select id="scenario-select" aria-label="选择场景"></select>
        <span class="scenario-badge" id="scenario-badge" title="场景加载来源">—</span>
      </div>

      <nav class="view-tabs" id="view-tabs" aria-label="视图切换" role="tablist"></nav>

      <div class="topbar-actions">
        <button class="btn btn-ghost" id="btn-import" type="button" aria-label="导入 JSONL / JSON 数据">
          <svg class="icon" aria-hidden="true"><use href="#i-import"></use></svg><span>导入</span>
        </button>
        <div class="menu-wrap">
          <button class="btn btn-ghost" id="btn-export" type="button" aria-haspopup="menu" aria-expanded="false" aria-label="导出菜单">
            <svg class="icon" aria-hidden="true"><use href="#i-export"></use></svg><span>导出</span>
            <svg class="icon icon-xs" aria-hidden="true"><use href="#i-chevron"></use></svg>
          </button>
          <div class="menu" id="export-menu" role="menu" hidden>
            <button class="menu-item" type="button" role="menuitem" data-export="findings"><svg class="icon"><use href="#i-download"></use></svg>导出发现（CSV）</button>
            <button class="menu-item" type="button" role="menuitem" data-export="evidence"><svg class="icon"><use href="#i-download"></use></svg>导出证据（JSON）</button>
            <button class="menu-item" type="button" role="menuitem" data-export="report"><svg class="icon"><use href="#i-download"></use></svg>导出报告（JSON）</button>
            <div class="menu-sep" role="separator"></div>
            <button class="menu-item" type="button" role="menuitem" data-export="link"><svg class="icon"><use href="#i-link"></use></svg>复制当前深链</button>
          </div>
        </div>
        <button class="btn btn-icon" id="btn-help" type="button" aria-label="帮助与快捷键" title="帮助与快捷键（?）">
          <svg class="icon" aria-hidden="true"><use href="#i-help"></use></svg>
        </button>
      </div>
    </header>

    <div class="data-banner" id="data-banner" hidden>
      <svg class="icon" aria-hidden="true"><use href="#i-info"></use></svg>
      <span id="data-banner-text">未检测到数据集，已载入内置演示数据。</span>
      <button class="btn btn-sm" id="banner-import" type="button">导入 JSONL</button>
      <button class="btn btn-icon btn-sm" id="banner-close" type="button" aria-label="关闭提示">
        <svg class="icon icon-sm" aria-hidden="true"><use href="#i-close"></use></svg>
      </button>
    </div>

    <div class="workspace" id="workspace">
      <aside class="sidebar" id="sidebar" aria-label="筛选条件">
        <div class="sidebar-head">
          <div class="sidebar-title">
            <svg class="icon" aria-hidden="true"><use href="#i-filter"></use></svg>筛选
            <span class="sidebar-count" id="active-filter-count" hidden></span>
          </div>
          <button class="btn btn-sm" id="btn-reset-filters" type="button">重置</button>
        </div>

        <div class="search-box">
          <svg class="icon" aria-hidden="true"><use href="#i-search"></use></svg>
          <input id="filter-search" type="search" placeholder="搜索节点 / 事件 / 证据…" aria-label="搜索" autocomplete="off" spellcheck="false">
          <kbd>/</kbd>
        </div>

        <div class="sidebar-scroll" id="sidebar-filters"></div>

        <div class="sidebar-foot">
          <div class="quality-card" id="quality-card"></div>
          <div class="shortcut-hints">
            <div class="hint-title">快捷键</div>
            <div class="hint-row"><kbd>1</kbd>–<kbd>6</kbd><span>切换视图</span></div>
            <div class="hint-row"><kbd>/</kbd><span>搜索</span><kbd>Esc</kbd><span>关闭</span></div>
            <div class="hint-row"><kbd>Space</kbd><span>播放</span><kbd>←</kbd><kbd>→</kbd><span>步进</span></div>
            <div class="hint-row"><kbd>F</kbd><span>适配视图</span><kbd>C</kbd><span>关键路径</span></div>
          </div>
        </div>
      </aside>

      <main class="main" id="main" tabindex="-1">
        <div class="view-root" id="view-root"></div>
      </main>

      <aside class="drawer" id="drawer" hidden aria-label="详情抽屉">
        <div class="drawer-header">
          <div class="drawer-heading">
            <span class="drawer-kicker" id="drawer-kicker">详情</span>
            <h2 class="drawer-title" id="drawer-title">—</h2>
          </div>
          <button class="btn btn-icon" id="btn-drawer-close" type="button" aria-label="关闭详情（Esc）" title="关闭（Esc）">
            <svg class="icon" aria-hidden="true"><use href="#i-close"></use></svg>
          </button>
        </div>
        <div class="drawer-body" id="drawer-body"></div>
      </aside>
    </div>

    <footer class="replaybar" id="replaybar" hidden aria-label="回放控制">
      <div class="replay-controls">
        <button class="btn btn-icon" id="btn-prev" type="button" aria-label="上一事件（←）" title="上一事件（←）">
          <svg class="icon" aria-hidden="true"><use href="#i-prev"></use></svg>
        </button>
        <button class="btn btn-play" id="btn-play" type="button" aria-label="播放回放（Space）" title="播放（Space）">
          <svg class="icon" aria-hidden="true"><use href="#i-play"></use></svg>
        </button>
        <button class="btn btn-icon" id="btn-next" type="button" aria-label="下一事件（→）" title="下一事件（→）">
          <svg class="icon" aria-hidden="true"><use href="#i-next"></use></svg>
        </button>
      </div>
      <div class="replay-track">
        <div class="replay-meta">
          <span class="replay-current" id="replay-current">全部事件已展示</span>
          <span class="replay-counter" id="replay-counter">0 / 0</span>
        </div>
        <input class="replay-slider" id="replay-slider" type="range" min="0" max="0" value="0" step="1" aria-label="回放进度">
      </div>
      <div class="replay-right">
        <span class="replay-time" id="replay-time">—</span>
        <label class="speed-picker">
          <span class="sr-only">播放速度</span>
          <select id="replay-speed" aria-label="播放速度">
            <option value="0.5">0.5×</option>
            <option value="1" selected>1×</option>
            <option value="2">2×</option>
            <option value="4">4×</option>
          </select>
        </label>
      </div>
    </footer>
  </div>

  <div class="modal-root" id="modal-root"></div>
